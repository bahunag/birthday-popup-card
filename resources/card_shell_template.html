      /* 3. 4 层零穿模 3D 翻页与手势旋转主循环 */
      let isOpen = false, openProgress = 0, candleLit = true;
      let starLightsOn = true, starBurstTimer = null;
      let userTiltX = 0, userTiltY = 0, stageScale = 1, closedScale = 1;
      let dragging = false, sx = 0, sy = 0, bx = 0, by = 0, moved = 0;

      const els = {
        rig: document.getElementById('cardRig'),
        shadow: document.getElementById('tableShadow'),
        left: document.getElementById('leftLeaf'),
        right: document.getElementById('rightLeaf'),
        arch: document.getElementById('archLayer'),
        char: document.getElementById('charLayer'),
        charShadow: document.getElementById('charShadow'),
        prop: document.getElementById('propLayer'),
        env: document.getElementById('envelopeLayer'),
        coverTip: document.getElementById('coverTip'),
        openControls: document.getElementById('openControls'),
        lblOpen: document.getElementById('lblOpen'),
        statusPill: document.getElementById('statusPill'),
        statusDot: document.getElementById('statusDot'),
        statusText: document.getElementById('statusText'),
        micMeterTrack: document.getElementById('micMeterTrack'),
        micMeterFill: document.getElementById('micMeterFill'),
        btnResetView: document.getElementById('btnResetView')
      };

      /**
       * 根据窗口尺寸与 3D 透视投影余量自适应缩放舞台，
       * 确保横版与 4:3 上下翻折版在 390x844、375x667 手机屏及拖拽偏转下均完整居中、零裁边
       */
      function updateScale() {
        const vw = window.innerWidth, vh = window.innerHeight;
        const stageH = document.getElementById('stageWrap').clientHeight || (vh - 110);
        if (topFold) {
          // 计入 rotateX(46°) 透视近端约 1.16x 放大与偏转余量，保证小屏左右安全留白
          stageScale = Math.max(0.24, Math.min(1.02, Math.min((vw - 28) / 700, (stageH - 28) / 910)));
          closedScale = Math.max(0.28, Math.min(1.02, Math.min((vw - 32) / 620, (stageH - 28) / 470)));
          return;
        }
        stageScale = Math.max(0.22, Math.min(1.12, Math.min((vw - 28) / 1000, (stageH - 28) / 610)));
      }
      updateScale();
      window.addEventListener('resize', updateScale);
      if ('ResizeObserver' in window) {
        new ResizeObserver(updateScale).observe(document.getElementById('stageWrap'));
      }

      const LEAF_PHASE_END = 0.56;
      const POPUP_GATE = 0.58;

      /**
       * 新版 4:3 横向长方形上下翻折两段式零穿模渲染帧：
       * 阶段 1 (0 ~ 0.56) 上封面完成翻越并稳停在 -26°；阶段 2 (0.58 ~ 1) 立体件从安全底座角度平滑弹起，全程 0 穿模
       *
       * @param {number} p - 翻开进度（0 = 合上 4:3 横矩形，1 = 完全向上掀开）
       */
      function renderTopFold4x3(p) {
        const leafT = Math.min(1, p / LEAF_PHASE_END);
        const leafEase = 1 - Math.pow(1 - leafT, 2.2);
        const scale = closedScale + (stageScale - closedScale) * leafEase;
        const shiftY = -206 + 218 * leafEase;
        els.rig.style.transform = `scale(${scale.toFixed(4)}) translate3d(0px, ${shiftY.toFixed(1)}px, 0px) rotateX(${(8 + 38 * leafEase + userTiltX).toFixed(2)}deg) rotateY(${userTiltY.toFixed(2)}deg)`;
        els.shadow.style.transform = `translate3d(0px, 16px, -24px)`;
        // 阶段 1 结束时上页稳停在 -26°，与后续立起的立体花拱张开安全夹角
        els.left.style.transform = `translateZ(${(3.2 * (1 - leafEase)).toFixed(2)}px) rotateX(${(-179.4 + 153.4 * leafEase).toFixed(2)}deg)`;
        els.right.style.transform = `rotateX(0deg)`;
        els.coverTip.style.opacity = p < 0.08 ? '1' : '0';

        // 仅当上封面完全翻越 -90° 并停稳在安全区后才显示并抬起立体部件，彻底消灭中间帧穿模
        if (p < POPUP_GATE) {
          popupStageEl.classList.add('popup-hidden');
          return;
        }
        popupStageEl.classList.remove('popup-hidden');
        const lift = (p - POPUP_GATE) / (1 - POPUP_GATE);
        const rise = Math.sin(lift * Math.PI / 2);
        const sy = Math.max(0.04, rise).toFixed(4);

        // 全程固定在安全立面夹角之上沿折线底座平滑长起，确保任意采样帧与上下页零交点
        els.arch.style.transform = `translate3d(0px, 14px, 10px) rotateX(-68deg) scaleY(${sy})`;
        els.char.style.transform = `translate3d(0px, 240px, 16px) rotateX(-70deg) scaleY(${sy})`;
        els.charShadow.style.opacity = (0.28 * rise).toFixed(3);
        els.charShadow.style.transform = `translate3d(0px, 244px, 2px) scale(${(0.72 + 0.28 * rise).toFixed(3)})`;

        propSlotEl.style.transform = `translate3d(${layout.propX}px, ${layout.propY}px, 10px)`;
        els.prop.style.transform = `rotateX(-70deg) scaleY(${sy})`;

        envSlotEl.style.transform = `translate3d(${layout.envX}px, ${layout.envY}px, 10px)`;
        els.env.style.transform = `rotateX(-64deg) scaleY(${sy})`;
      }

      /**
       * 横版左右对折两段式零穿模主渲染循环：
       * 阶段 1 (0 ~ 0.56) 左右纸页翻平停稳在 ±3.5°；阶段 2 (0.58 ~ 1) 4 层立体纸雕在安全 Z 走廊上平滑长起，任意中间帧 0 相交
       *
       * @param {number} [ts] - requestAnimationFrame 时间戳
       */
      let lastLoopTs = 0;
      function render3DLoop(ts) {
        const nowTs = typeof ts === 'number' ? ts : performance.now();
        const dt = lastLoopTs ? Math.min(0.08, Math.max(0.004, (nowTs - lastLoopTs) / 1000)) : 0.016;
        lastLoopTs = nowTs;

        const target = isOpen ? 1 : 0;
        const diff = target - openProgress;
        const stepFactor = 1 - Math.exp(-dt * 4.8);
        openProgress = Math.abs(diff) > 0.0012 ? openProgress + diff * stepFactor : target;

        const p = openProgress;
        if (topFold) {
          renderTopFold4x3(p);
          requestAnimationFrame(render3DLoop);
          return;
        }

        const leafT = Math.min(1, p / LEAF_PHASE_END);
        const leafEase = 1 - Math.pow(1 - leafT, 2.2);

        const cx = -215 * (1 - leafEase);
        const scale = stageScale + (Math.max(0.42, stageScale) - stageScale) * (1 - leafEase);
        els.rig.style.transform = `scale(${scale.toFixed(4)}) translate3d(${cx.toFixed(1)}px, ${(40 * leafEase).toFixed(1)}px, 0px) rotateX(${(10 + 38 * leafEase + userTiltX).toFixed(2)}deg) rotateY(${(-4 * (1 - leafEase) + userTiltY).toFixed(2)}deg)`;
        els.shadow.style.width = `${(440 + 420 * leafEase).toFixed(1)}px`;
        els.shadow.style.transform = `translate3d(${(215 * (1 - leafEase)).toFixed(1)}px, 20px, -24px)`;

        // 阶段 1 完成翻页并停稳在微折角 ±3.5°
        const pageAngle = 3.5 * leafEase;
        const leftAngle = 179.4 * (1 - leafEase) + pageAngle;
        els.left.style.transform = `translateZ(${(3.2 * (1 - leafEase)).toFixed(2)}px) rotateY(${leftAngle.toFixed(2)}deg)`;
        els.right.style.transform = `rotateY(${(-pageAngle).toFixed(2)}deg)`;
        els.coverTip.style.opacity = p < 0.08 ? '1' : '0';

        // 仅当左页已翻平落位后才露出并弹起立体件，彻底杜绝半开时左页切穿人物/花拱
        if (p < POPUP_GATE) {
          popupStageEl.classList.add('popup-hidden');
          requestAnimationFrame(render3DLoop);
          return;
        }
        popupStageEl.classList.remove('popup-hidden');
        const lift = (p - POPUP_GATE) / (1 - POPUP_GATE);
        const rise = Math.sin(lift * Math.PI / 2);
        const sy = Math.max(0.04, rise).toFixed(4);

        const rad = pageAngle * Math.PI / 180;
        const sinA = Math.sin(rad);
        const cosA = Math.cos(rad);
        const leftRad = leftAngle * Math.PI / 180;
        const sinL = Math.sin(leftRad);
        const cosL = Math.cos(leftRad);

        // Layer 1：后景拱门基准高于两侧翘起纸面 + 14px，全程 0 切穿
        const archBaseZ = (layout.archW * 0.5) * Math.max(sinA, sinL) + 14;
        els.arch.style.transform = `translate3d(0px, -46px, ${archBaseZ.toFixed(1)}px) rotateX(-68deg) scaleY(${sy})`;

        // Layer 2：中央人物基准高于边缘翘起纸面 + 18px，与拱门前后相距 ΔY=204px
        const charBaseZ = (layout.charW * 0.5) * Math.max(sinA, sinL) + 18;
        els.char.style.transform = `translate3d(0px, 158px, ${charBaseZ.toFixed(1)}px) rotateX(-70deg) scaleY(${sy})`;
        els.charShadow.style.opacity = (0.28 * rise).toFixed(3);
        els.charShadow.style.transform = `translate3d(0px, 162px, ${(charBaseZ - 6).toFixed(1)}px) scale(${(0.7 + 0.3 * rise).toFixed(3)})`;

        // Layer 3：左前道具紧贴左页平面 + 10px 之上，零穿底
        const pGX = layout.propX * cosL;
        const pGZ = -layout.propX * sinL + 10;
        propSlotEl.style.transform = `translate3d(${pGX.toFixed(1)}px, ${layout.propY}px, ${pGZ.toFixed(1)}px) rotateY(${leftAngle.toFixed(2)}deg)`;
        els.prop.style.transform = `rotateX(-70deg) scaleY(${sy})`;

        // Layer 4：右前火漆信封紧贴右页平面 + 10px 之上，右下角永不插进右页纸板
        const eGX = layout.envX * cosA;
        const eGZ = layout.envX * sinA + 10;
        envSlotEl.style.transform = `translate3d(${eGX.toFixed(1)}px, ${layout.envY}px, ${eGZ.toFixed(1)}px) rotateY(${(-pageAngle).toFixed(2)}deg)`;
        els.env.style.transform = `rotateX(-64deg) scaleY(${sy})`;

        requestAnimationFrame(render3DLoop);
      }
      requestAnimationFrame(render3DLoop);

      /* 4. 原生 Web Audio 机械八音盒（自动按主题演奏《生日快乐歌》或《We Wish You a Merry Christmas》） */
      let mCtx = null, mGain = null, mRev = null, mTimer = null, mIdx = 0, musicPlaying = false;
      const FREQ = {
        D4:293.7, E4:329.6, F4:349.2, G4:392.0, A4:440.0, Bb4:466.2, B4:493.9,
        C5:523.3, D5:587.3, E5:659.3, F5:698.5, G5:784.0, A5:880.0
      };
      const BIRTHDAY_SCORE = [
        ['C5',0.75],['C5',0.25],['D5',1,'F4'],['C5',1,'A4'],['F5',1,'A4'],['E5',2,'G4'],
        ['C5',0.75],['C5',0.25],['D5',1,'E4'],['C5',1,'G4'],['G5',1,'Bb4'],['F5',2,'A4'],
        ['C5',0.75],['C5',0.25],['C5',1,'F4'],['A5',1,'C5'],['F5',1,'A4'],['E5',1,'G4'],['D5',1.6,'F4'],
        ['Bb4',0.75],['Bb4',0.25],['A5',1,'C5'],['F5',1,'A4'],['G5',1,'Bb4'],['F5',2.8,'A4',true]
      ];
      const CHRISTMAS_SCORE = [
        ['G4',1],['C5',1,'E4'],['C5',0.5],['D5',0.5],['C5',0.5],['B4',0.5],['A4',1,'F4'],['A4',1],['A4',1],
        ['D5',1,'F4'],['D5',0.5],['E5',0.5],['D5',0.5],['C5',0.5],['B4',1,'G4'],['G4',1],['G4',1],
        ['E5',1,'G4'],['E5',0.5],['F5',0.5],['E5',0.5],['D5',0.5],['C5',1,'A4'],['A4',1],['G4',0.5],['G4',0.5],
        ['A4',1,'F4'],['D5',1,'G4'],['B4',1,'G4'],['C5',2.8,'E4',true]
      ];
      const ACTIVE_SCORE = isChristmas ? CHRISTMAS_SCORE : BIRTHDAY_SCORE;
      const BEAT_MS = isChristmas ? 420 : 560;

      const MUSIC_MASTER_GAIN = 0.84;
      let mComp = null;

      /**
       * 在用户点击手势同步周期内初始化并唤醒共用 Web Audio 上下文：
       * 串接 DynamicsCompressorNode 防破音限幅器，使手机 50% 日常音量也能清脆响亮、100% 音量绝不爆音
       *
       * @returns {AudioContext | null} 可用的音频上下文
       */
      function ensureAudioCtx() {
        try {
          if (!mCtx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            mCtx = new AC();
            mComp = mCtx.createDynamicsCompressor();
            mComp.threshold.value = -10;
            mComp.knee.value = 12;
            mComp.ratio.value = 6;
            mComp.attack.value = 0.003;
            mComp.release.value = 0.14;
            mComp.connect(mCtx.destination);

            mGain = mCtx.createGain();
            mGain.gain.value = MUSIC_MASTER_GAIN;
            mGain.connect(mComp);

            mRev = mCtx.createGain();
            mRev.gain.value = 0.36;
            const dly = mCtx.createDelay(); dly.delayTime.value = 0.17;
            const fb = mCtx.createGain(); fb.gain.value = 0.28;
            const lp = mCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
            mRev.connect(dly); dly.connect(lp); lp.connect(fb); fb.connect(dly); lp.connect(mGain);

            // 发送极短静音脉冲激活部分移动浏览器音频通道
            try {
              const unlockBuf = mCtx.createBuffer(1, 1, mCtx.sampleRate);
              const unlockSrc = mCtx.createBufferSource();
              unlockSrc.buffer = unlockBuf;
              unlockSrc.connect(mCtx.destination);
              unlockSrc.start(0);
            } catch {}
          }
          if (mCtx.state === 'suspended') mCtx.resume().catch(() => {});
          return mCtx;
        } catch {
          return null;
        }
      }

      /**
       * 拨动八音盒钢齿发出温暖饱满的三层谐波机械八音盒音色（针对手机小扬声器声学曲线优化）
       *
       * @param {number} f - 音符基频（Hz）
       * @param {number} v - 相对音量（0 ~ 1）
       */
      function pluck(f, v) {
        if (!mCtx || !f) return;
        const now = mCtx.currentTime;
        // 主基波：厚实温暖主音
        const o1 = mCtx.createOscillator(), g1 = mCtx.createGain();
        o1.type = 'sine'; o1.frequency.setValueAtTime(f, now);
        g1.gain.setValueAtTime(0.0001, now);
        g1.gain.linearRampToValueAtTime(0.78 * v, now + 0.007);
        g1.gain.exponentialRampToValueAtTime(0.0001, now + 1.42);
        o1.connect(g1); g1.connect(mGain); g1.connect(mRev); o1.start(now); o1.stop(now + 1.48);

        // 二倍频八度泛音（三角波）：显著提升手机小扬声器在 50% 音量下的清晰度与甜美质感
        const o2 = mCtx.createOscillator(), g2 = mCtx.createGain();
        o2.type = 'triangle'; o2.frequency.setValueAtTime(f * 2.0, now);
        g2.gain.setValueAtTime(0.0001, now);
        g2.gain.linearRampToValueAtTime(0.26 * v, now + 0.004);
        g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
        o2.connect(g2); g2.connect(mGain); g2.connect(mRev); o2.start(now); o2.stop(now + 0.45);

        // 三倍频钢齿拨片泛音：还原八音盒金属敲击瞬态
        const o3 = mCtx.createOscillator(), g3 = mCtx.createGain();
        o3.type = 'sine'; o3.frequency.setValueAtTime(f * 3.01, now);
        g3.gain.setValueAtTime(0.0001, now);
        g3.gain.linearRampToValueAtTime(0.15 * v, now + 0.003);
        g3.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);
        o3.connect(g3); g3.connect(mGain); o3.start(now); o3.stop(now + 0.13);
      }

      /**
       * 推进机械八音盒当前主题的下一个乐谱音符
       */
      function stepMusic() {
        if (!musicPlaying) return;
        const [n, b, h, isEnd] = ACTIVE_SCORE[mIdx];
        pluck(FREQ[n], 1); if (h) pluck(FREQ[h], 0.46);
        mIdx = (mIdx + 1) % ACTIVE_SCORE.length;
        mTimer = setTimeout(stepMusic, b * BEAT_MS + (isEnd ? 1100 : 0));
      }

      /**
       * 启动八音盒木质共鸣腔并播放对应节日乐曲（全程保持饱满清晰音量）
       */
      function startMusic() {
        if (musicPlaying) return;
        const ctx = ensureAudioCtx();
        if (ctx && mGain) {
          mGain.gain.setValueAtTime(MUSIC_MASTER_GAIN, ctx.currentTime);
          musicPlaying = true; mIdx = 0; clearTimeout(mTimer); stepMusic();
        }
        syncUI();
      }

      /**
       * 平顺淡出并停止八音盒音乐
       */
      function stopMusic() {
        musicPlaying = false; clearTimeout(mTimer);
        if (mCtx && mGain) try { mGain.gain.setTargetAtTime(0.0001, mCtx.currentTime, 0.08); } catch {}
        syncUI();
      }

      /* 5. 生日模式：翻开自动申请麦克风 + 宽带气流吹气检测（隔离八音盒/嗡声/单音）+ 1秒零报错长按兜底 */
      const HOLD_START_MS = 140;
      const BLOW_DURATION_MS = 860;
      const flameWrapEl = document.getElementById('flameWrap');
      const flameHaloEl = flameWrapEl ? flameWrapEl.querySelector('.flame-halo') : null;

      let blowing = false, blowProgress = 0, blowHoldTimer = null, blowRaf = null, blowStartTime = 0;
      let blowOrigin = null, holdFinishedOrigin = null;
      let suppressPropClick = false, suppressStageClick = false;
      let suppressPropTimer = null, suppressStageTimer = null;
      let wishMsg = '', blowNoiseBuf = null, blowNoiseSrc = null, blowFilter = null, blowGain = null;

      // 高灵敏度麦克风状态、翻开前预授权锁与并发请求防泄漏会话锁
      const MIC_AUTH_TIMEOUT_MS = 5000;
      let micActive = false, micPending = false, micPermissionDenied = false, micSessionId = 0, micAutoAttempted = false, micLevel = 0;
      let openingInProgress = false;
      let micStream = null, micSource = null, micGainNode = null, micAnalyser = null, micRaf = null, micOwnCtx = null;

      /**
       * 生成并缓存 1.5 秒柔和风声白噪声缓冲区（用于长按仿真吹气兜底音效）
       *
       * @param {AudioContext} ctx - 活跃的音频上下文
       * @returns {AudioBuffer} 白噪声缓冲
       */
      function getBlowNoiseBuffer(ctx) {
        if (blowNoiseBuf) return blowNoiseBuf;
        const len = Math.floor(ctx.sampleRate * 1.5);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        blowNoiseBuf = buf;
        return buf;
      }

      /**
       * 启动 Web Audio 柔和仿真吹风声
       */
      function startBlowWindSound() {
        try {
          const ctx = ensureAudioCtx();
          if (!ctx) return;
          stopBlowWindSound(false);
          const now = ctx.currentTime;
          const src = ctx.createBufferSource();
          src.buffer = getBlowNoiseBuffer(ctx);
          src.loop = true;
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass'; filter.frequency.setValueAtTime(420, now); filter.Q.setValueAtTime(1.6, now);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.0001, now); gain.gain.linearRampToValueAtTime(0.15, now + 0.16);
          src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
          src.start(now);
          blowNoiseSrc = src; blowFilter = filter; blowGain = gain;
        } catch {}
      }

      /**
       * 随长按吹气进度平滑调节吹风频响
       *
       * @param {number} progress - 吹气蓄力进度（0 ~ 1）
       */
      function updateBlowWindSound(progress) {
        if (!mCtx || !blowFilter) return;
        try { blowFilter.frequency.setTargetAtTime(420 + progress * 380, mCtx.currentTime, 0.04); } catch {}
      }

      /**
       * 平滑淡出吹风声，吹灭瞬间叠加一声轻柔气声尾音
       *
       * @param {boolean} withPuff - 是否叠加灭烛尾音
       */
      function stopBlowWindSound(withPuff) {
        try {
          if (mCtx && blowGain && blowNoiseSrc) {
            const now = mCtx.currentTime;
            const prevSrc = blowNoiseSrc;
            blowGain.gain.cancelScheduledValues(now);
            blowGain.gain.setValueAtTime(Math.max(0.0001, blowGain.gain.value), now);
            blowGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
            prevSrc.stop(now + 0.12);
          }
          if (withPuff && mCtx) {
            const now = mCtx.currentTime;
            const puffSrc = mCtx.createBufferSource();
            puffSrc.buffer = getBlowNoiseBuffer(mCtx);
            const puffFilter = mCtx.createBiquadFilter();
            puffFilter.type = 'lowpass'; puffFilter.frequency.setValueAtTime(260, now); puffFilter.frequency.exponentialRampToValueAtTime(90, now + 0.09);
            const puffGain = mCtx.createGain();
            puffGain.gain.setValueAtTime(0.09, now); puffGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
            puffSrc.connect(puffFilter); puffFilter.connect(puffGain); puffGain.connect(mCtx.destination);
            puffSrc.start(now); puffSrc.stop(now + 0.1);
          }
        } catch {}
        blowNoiseSrc = null; blowFilter = null; blowGain = null;
      }

      /**
       * 驱动火苗迎风斜倾摇曳与光晕收缩效果（同时服务于真实麦克风吹气与长按仿真吹气）
       *
       * @param {number} progress - 吹气风力强度（0 ~ 1）
       * @param {number} elapsedMs - 时间戳（毫秒）
       */
      function applyFlameWind(progress, elapsedMs) {
        if (!flameWrapEl || isChristmas) return;
        if (progress <= 0.01) {
          flameWrapEl.classList.remove('is-blowing');
          flameWrapEl.style.transform = '';
          flameWrapEl.style.opacity = '';
          if (flameHaloEl) { flameHaloEl.style.transform = ''; flameHaloEl.style.opacity = ''; }
          return;
        }
        flameWrapEl.classList.add('is-blowing');
        const jitter = Math.sin(elapsedMs * 0.038) * (4 + progress * 5);
        const skew = 10 + progress * 34 + jitter;
        const sx = Math.max(0.55, 1 - progress * 0.36);
        const sy = Math.max(0.42, 1 - progress * 0.48);
        const op = Math.max(0.28, 1 - progress * 0.62);
        flameWrapEl.style.transform = `skewX(${skew.toFixed(1)}deg) scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`;
        flameWrapEl.style.opacity = op.toFixed(3);
        if (flameHaloEl) {
          const haloScale = Math.max(0.45, 1 - progress * 0.5);
          flameHaloEl.style.transform = `scale(${haloScale.toFixed(3)})`;
          flameHaloEl.style.opacity = op.toFixed(3);
        }
      }

      /**
       * 安全停用并释放指定音频流下的全部音轨
       *
       * @param {MediaStream | null} stream - 目标媒体流
       */
      function stopStreamTracks(stream) {
        if (!stream) return;
        try { stream.getTracks().forEach((t) => { try { t.stop(); } catch {} }); } catch {}
      }

      /**
       * 安全停止真实麦克风流、递增作废所有在途会话并释放设备占用，同时恢复八音盒音量
       */
      function stopMicDetector() {
        micSessionId += 1;
        micPending = false;
        micActive = false;
        micLevel = 0;
        if (micRaf) { cancelAnimationFrame(micRaf); micRaf = null; }
        try { if (micSource) micSource.disconnect(); } catch {}
        try { if (micGainNode) micGainNode.disconnect(); } catch {}
        stopStreamTracks(micStream);
        if (micOwnCtx && micOwnCtx !== mCtx) {
          micOwnCtx.close().catch(() => {});
        }
        micStream = null; micSource = null; micGainNode = null; micAnalyser = null; micOwnCtx = null;
        if (musicPlaying && mCtx && mGain) {
          try { mGain.gain.setTargetAtTime(MUSIC_MASTER_GAIN, mCtx.currentTime, 0.08); } catch {}
        }
        els.micMeterFill.style.width = '4%';
        if (!blowing) applyFlameWind(0, 0);
        syncUI();
      }

      /**
       * 向浏览器申请一次麦克风原始音频流（内置 5 秒防卡死超时与仅约束错误降级重试，拒权不重问）
       *
       * @param {number} session - 所属会话编号
       * @param {number} [timeoutMs=MIC_AUTH_TIMEOUT_MS] - 超时毫秒数（0 表示不限时）
       * @returns {Promise<MediaStream | null>} 成功返回音轨流，拒绝/超时/过期返回 null
       */
      async function requestMicStreamSafe(session, timeoutMs = MIC_AUTH_TIMEOUT_MS) {
        if (micPermissionDenied || !window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          return null;
        }
        let timedOut = false;
        let timer = null;
        const doAcquire = async () => {
          try {
            return await navigator.mediaDevices.getUserMedia({
              audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false,
                googEchoCancellation: false,
                googNoiseSuppression: false,
                googAutoGainControl: false,
                googHighpassFilter: false
              }
            });
          } catch (err) {
            const errName = (err && err.name) || '';
            if (errName === 'NotAllowedError' || errName === 'PermissionDeniedError' || errName === 'SecurityError') {
              micPermissionDenied = true;
            }
            const canRetryBasic = errName === 'OverconstrainedError' || errName === 'ConstraintNotSatisfiedError' || errName === 'TypeError';
            if (!canRetryBasic || timedOut || session !== micSessionId) return null;
            try {
              return await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (err2) {
              const err2Name = (err2 && err2.name) || '';
              if (err2Name === 'NotAllowedError' || err2Name === 'PermissionDeniedError' || err2Name === 'SecurityError') {
                micPermissionDenied = true;
              }
              return null;
            }
          }
        };

        const acquirePromise = doAcquire().then((st) => {
          if (timedOut || session !== micSessionId) {
            stopStreamTracks(st);
            return null;
          }
          return st;
        });

        if (!timeoutMs || timeoutMs <= 0) return acquirePromise;

        const timeoutPromise = new Promise((resolve) => {
          timer = setTimeout(() => {
            timedOut = true;
            resolve(null);
          }, timeoutMs);
        });

        const result = await Promise.race([acquirePromise, timeoutPromise]);
        if (timer) clearTimeout(timer);
        return result;
      }

      /**
       * 启动高灵敏度宽带低频吹气检测（仅生日模式）：
       * 1. 会话编号防竞态：快开快合或超时迟到返回立即关停其音轨，零泄漏；
       * 2. 拒权零重问：仅当不支持高级约束报错时降级试基础音频，权限被拒立刻静默进长按兜底；
       * 3. 采样率自适应宽带平坦度识别：捕捉低频随机吹气气流，隔离高响度八音盒、180Hz 嗡声与 440Hz 单音。
       *
       * @param {MediaStream} [customStream] - 可选的预授权或外部测试音频流
       * @param {AudioContext} [customCtx] - 可选的测试音频上下文
       * @returns {Promise<boolean>} 是否成功启动监听
       */
      async function startMicWithStream(customStream, customCtx) {
        if (isChristmas || !isOpen || !candleLit || micActive || micPending) {
          if (customStream) stopStreamTracks(customStream);
          return false;
        }
        const session = ++micSessionId;
        micPending = true;
        const ctx = customCtx || ensureAudioCtx();
        if (!ctx) {
          if (customStream) stopStreamTracks(customStream);
          if (session === micSessionId) micPending = false;
          return false;
        }

        let stream = customStream || null;
        if (!stream) {
          stream = await requestMicStreamSafe(session, MIC_AUTH_TIMEOUT_MS);
          if (!stream) {
            if (session === micSessionId) micPending = false;
            return false;
          }
        }

        if (session !== micSessionId || !isOpen || !candleLit) {
          stopStreamTracks(stream);
          if (session === micSessionId) micPending = false;
          return false;
        }

        try {
          if (ctx.state === 'suspended') await ctx.resume();
          if (session !== micSessionId || !isOpen || !candleLit) {
            stopStreamTracks(stream);
            if (session === micSessionId) micPending = false;
            return false;
          }

          micOwnCtx = ctx;
          micStream = stream;
          micSource = ctx.createMediaStreamSource(stream);
          micGainNode = ctx.createGain();
          micGainNode.gain.value = 3.2;
          micAnalyser = ctx.createAnalyser();
          // 使用 1024 点高精度 FFT，按实际采样率精准区分窄带嗡声/乐音单峰与宽带湍流吹气
          micAnalyser.fftSize = 1024;
          micAnalyser.smoothingTimeConstant = 0.25;

          micSource.connect(micGainNode);
          micGainNode.connect(micAnalyser);

          const sr = ctx.sampleRate || 48000;
          const binHz = sr / micAnalyser.fftSize;
          const totalBins = micAnalyser.frequencyBinCount;
          const lowStart = Math.max(1, Math.floor(70 / binHz));
          const lowEnd = Math.min(totalBins - 1, Math.max(lowStart + 2, Math.ceil(360 / binHz)));
          const midStart = lowEnd + 1;
          const midEnd = Math.min(totalBins - 1, Math.max(midStart + 3, Math.ceil(1350 / binHz)));
          const broadEnd = Math.min(totalBins - 1, Math.max(lowStart + 6, Math.ceil(680 / binHz)));
          const highStart = Math.min(totalBins - 1, Math.floor(1550 / binHz));
          const highEnd = Math.min(totalBins - 1, Math.max(highStart + 2, Math.ceil(3600 / binHz)));

          const timeBuf = new Float32Array(micAnalyser.fftSize);
          const freqBuf = new Uint8Array(totalBins);
          const micStartTs = performance.now();
          let calFrames = 0, sumRms = 0, sumLow = 0;
          let baseRms = 0.012, baseLow = 18, charge = 0;
          micPending = false;
          micActive = true;
          syncUI();

          const loop = (now) => {
            if (session !== micSessionId || !micActive || !isOpen || !candleLit) return;
            micAnalyser.getFloatTimeDomainData(timeBuf);
            micAnalyser.getByteFrequencyData(freqBuf);

            let sq = 0;
            for (let i = 0; i < timeBuf.length; i++) sq += timeBuf[i] * timeBuf[i];
            const rms = Math.sqrt(sq / timeBuf.length);

            let lowSum = 0;
            for (let i = lowStart; i <= lowEnd; i++) lowSum += freqBuf[i];
            const lowAvg = lowSum / (lowEnd - lowStart + 1);

            let midSum = 0;
            for (let i = midStart; i <= midEnd; i++) midSum += freqBuf[i];
            const midAvg = midSum / Math.max(1, midEnd - midStart + 1);

            let highSum = 0;
            for (let i = highStart; i <= highEnd; i++) highSum += freqBuf[i];
            const highAvg = highSum / Math.max(1, highEnd - highStart + 1);

            // 前 700ms 等待动画展开与高响度八音盒起音平稳，杜绝开卡瞬间自触发
            if (now - micStartTs < 700) {
              micRaf = requestAnimationFrame(loop);
              return;
            }

            if (calFrames < 16) {
              sumRms += rms; sumLow += lowAvg; calFrames++;
              if (calFrames === 16) {
                baseRms = Math.min(0.095, Math.max(0.008, sumRms / 16));
                baseLow = Math.min(115, Math.max(12, sumLow / 16));
              }
              micRaf = requestAnimationFrame(loop);
              return;
            }

            // 宽带平坦度检测（70~680Hz 区间）：识别宽带随机气流 vs 高响度八音盒/180Hz 嗡声/440Hz 单音
            let maxBroadDb = 0;
            let totalLinPower = 0;
            const binLin = [];
            for (let i = lowStart; i <= broadEnd; i++) {
              const v = freqBuf[i];
              if (v > maxBroadDb) maxBroadDb = v;
              const p = Math.pow(10, v / 65);
              binLin.push(p);
              totalLinPower += p;
            }
            let activeBins = 0;
            const activeFloor = Math.max(24, maxBroadDb - 42);
            for (let i = lowStart; i <= broadEnd; i++) {
              if (freqBuf[i] >= activeFloor) activeBins++;
            }
            let top2PairMax = 0;
            for (let k = 0; k < binLin.length; k++) {
              const pair = binLin[k] + (k + 1 < binLin.length ? binLin[k + 1] : 0);
              if (pair > top2PairMax) top2PairMax = pair;
            }
            const activeRatio = activeBins / Math.max(1, broadEnd - lowStart + 1);
            const top2LinRatio = totalLinPower > 0 ? (top2PairMax / totalLinPower) : 1;

            // 真吹气判据：低频风能占主（压过八音盒中高频音阶与二倍泛音）+ 连续宽带起风 + 无单音孤立尖峰
            const isBroadbandWind = activeRatio >= 0.38 && top2LinRatio <= 0.68 && lowAvg >= midAvg * 0.92 && lowAvg >= highAvg * 1.15;
            const rmsThresh = Math.max(0.026, baseRms * 1.95);
            const lowThresh = Math.max(36, baseLow * 1.65);
            const isWindHit = isBroadbandWind && rms >= rmsThresh && lowAvg >= lowThresh;

            if (isWindHit) {
              const rmsRatio = (rms - baseRms) / rmsThresh;
              const lowRatio = (lowAvg - baseLow) / lowThresh;
              const windScore = Math.min(1.8, Math.max(rmsRatio, lowRatio));
              micLevel = Math.min(1, windScore * 0.85);
              charge = Math.min(1, charge + 0.045 + Math.min(0.045, windScore * 0.022));
            } else {
              baseRms = baseRms * 0.96 + rms * 0.04;
              baseLow = baseLow * 0.96 + lowAvg * 0.04;
              micLevel = Math.max(0, micLevel * 0.72);
              charge = Math.max(0, charge - 0.055);
            }

            els.micMeterFill.style.width = `${Math.round(Math.max(4, Math.min(100, (charge * 0.58 + micLevel * 0.42) * 100)))}%`;
            if (!blowing) applyFlameWind(Math.min(1, Math.max(charge, micLevel * 0.88)), now);

            if (charge >= 1) {
              stopMicDetector();
              extinguishCandle();
              return;
            }
            micRaf = requestAnimationFrame(loop);
          };
          micRaf = requestAnimationFrame(loop);
          return true;
        } catch {
          stopStreamTracks(stream);
          if (session === micSessionId) stopMicDetector();
          return false;
        }
      }

      /**
       * 取消长按仿真吹气并平滑复位火苗
       *
       * @param {boolean} [extinguished=false] - 是否因吹满熄灭而结束
       */
      function cancelHoldBlow(extinguished = false) {
        if (blowHoldTimer) { clearTimeout(blowHoldTimer); blowHoldTimer = null; }
        if (blowRaf) { cancelAnimationFrame(blowRaf); blowRaf = null; }
        const wasBlowing = blowing;
        blowing = false;
        blowProgress = 0;
        blowOrigin = null;
        if (wasBlowing || extinguished) stopBlowWindSound(extinguished);
        applyFlameWind(0, 0);
        syncUI();
      }

      /**
       * 启动长按约 1 秒仿真吹气循环（零权限兜底体验）
       */
      function startHoldBlow() {
        blowHoldTimer = null;
        if (isChristmas || !isOpen || !candleLit || blowing) return;
        blowing = true;
        blowProgress = 0;
        blowStartTime = performance.now();
        startBlowWindSound();
        syncUI();

        const step = (now) => {
          if (!blowing || !isOpen || !candleLit) return;
          const elapsed = now - blowStartTime;
          blowProgress = Math.min(1, elapsed / BLOW_DURATION_MS);
          applyFlameWind(blowProgress, elapsed);
          updateBlowWindSound(blowProgress);
          if (blowProgress >= 1) {
            holdFinishedOrigin = blowOrigin;
            if (blowOrigin === 'btn') suppressPropClick = true;
            else if (blowOrigin === 'cake') suppressStageClick = true;
            cancelHoldBlow(true);
            extinguishCandle();
            return;
          }
          blowRaf = requestAnimationFrame(step);
        };
        blowRaf = requestAnimationFrame(step);
      }

      /* 6. 飘落特效、生日蜡烛与圣诞树星星灯互动 */
      /**
       * 释放满屏轻柔飘落的水彩花瓣（生日）或冬日雪花彩屑（圣诞）
       */
      function spawnCelebrationParticles() {
        const layer = document.getElementById('petalsLayer');
        const cols = isChristmas
          ? ['#ffffff', '#fdf6e3', '#c84b3e', '#4f7348', '#e8b954']
          : [flower, accent, '#e899ab', '#f0be59'];
        for (let i = 0; i < 28; i++) {
          const sp = document.createElement('span');
          const isSnow = isChristmas && i % 2 === 0;
          sp.className = isSnow ? 'petal snow-flake' : 'petal';
          const sz = isSnow ? (5 + (i % 5)) : (9 + (i % 6));
          sp.style.cssText = `left:${6 + Math.random()*88}%;width:${sz}px;height:${sz}px;background:${cols[i%cols.length]};animation-delay:${(Math.random()*0.9).toFixed(2)}s;--dx:${Math.round((Math.random()-0.5)*115)}px`;
          layer.appendChild(sp);
          setTimeout(() => sp.remove(), 4800);
        }
      }

      /**
       * 生日模式：吹灭蜡烛、停止麦克风并飘落花瓣
       */
      function extinguishCandle() {
        if (isChristmas || !candleLit) return;
        candleLit = false; stopMicDetector(); cancelHoldBlow(false); spawnCelebrationParticles();
        wishMsg = '蜡烛已吹灭，愿所有温柔与美好如期而至';
        syncUI();
        setTimeout(() => { wishMsg = ''; syncUI(); }, 4000);
      }

      /**
       * 生日模式：切换吹灭或重新点燃蜡烛
       */
      function toggleCandle() {
        if (isChristmas) return;
        if (candleLit) extinguishCandle();
        else {
          candleLit = true; wishMsg = ''; syncUI();
          if (isOpen && micAutoAttempted) startMicWithStream();
        }
      }

      /**
       * 圣诞模式：轻点圣诞树或星灯按钮，触发星灯璀璨绽放与冬日飘雪许愿（保持星灯常亮闪烁）
       */
      function triggerChristmasStarWish() {
        if (!isChristmas || !isOpen) return;
        const layer = document.getElementById('treeLightsLayer');
        if (!starLightsOn) {
          starLightsOn = true;
          layer.classList.remove('lights-off');
        }
        layer.classList.add('lights-burst');
        clearTimeout(starBurstTimer);
        starBurstTimer = setTimeout(() => layer.classList.remove('lights-burst'), 3200);
        spawnCelebrationParticles();
        wishMsg = '圣诞快乐，愿漫天星光与温暖常伴左右';
        syncUI();
        setTimeout(() => { wishMsg = ''; syncUI(); }, 4000);
      }

      /* 7. 刺绣祝福信读写与双模渲染 */
      let blessing = JSON.parse(JSON.stringify(cfg.blessing || {}));
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) blessing = Object.assign(blessing, JSON.parse(saved));
      } catch {}

      /**
       * 将祝福语内容渲染到手工棉麻毛边刺绣布贴中，并按正文长度与行数自动启用紧凑字号档位
       */
      function renderBlessing() {
        const lineCount = (blessing.lines || []).length;
        const charCount = (blessing.lines || []).reduce((acc, s) => acc + (s ? s.length : 0), 0);
        const isCompact = lineCount >= 8 || charCount >= 92;
        const isDense = !isCompact && (lineCount >= 6 || charCount >= 64);

        [document.getElementById('linenPhotoCard'), document.getElementById('linenCssCard')].forEach((cardEl) => {
          cardEl.classList.toggle('text-compact', isCompact);
          cardEl.classList.toggle('text-dense', isDense);
        });

        ['pView', 'cView'].forEach((prefix) => {
          document.getElementById(prefix + 'Recipient').textContent = blessing.recipient || '';
          const box = document.getElementById(prefix + 'Lines'); box.innerHTML = '';
          (blessing.lines || []).forEach((t) => { const p = document.createElement('p'); p.textContent = t; box.appendChild(p); });
          document.getElementById(prefix + 'Closing').textContent = blessing.closing || '';
          document.getElementById(prefix + 'Sig').textContent = blessing.signature || '';
          document.getElementById(prefix + 'SubSig').textContent = blessing.subSignature || '';
        });
      }
      renderBlessing();

      /* 8. 界面状态同步 */
      /**
       * 同步底部 4 键状态、火焰/星灯显隐、星尘与顶部提示条
       */
      function syncUI() {
        els.lblOpen.textContent = isOpen ? '合上' : '翻开贺卡';
        els.openControls.style.display = isOpen ? 'inline-flex' : 'none';
        sparklesEl.classList.toggle('show', isOpen);
        document.getElementById('btnMusic').classList.toggle('music-on', musicPlaying);
        document.getElementById('lblMusic').textContent = musicPlaying ? '八音盒' : '音乐';

        const btnProp = document.getElementById('btnPropAction');
        if (isChristmas) {
          btnProp.classList.toggle('star-on', starLightsOn);
          document.getElementById('lblPropAction').textContent = '星灯';
        } else {
          btnProp.classList.toggle('blowing-on', blowing);
          document.getElementById('lblPropAction').textContent = blowing ? '吹气中' : (candleLit ? '吹蜡烛' : '点蜡烛');
          if (flameWrapEl) flameWrapEl.style.display = candleLit ? 'block' : 'none';
          document.getElementById('smokeWrap').style.display = candleLit ? 'none' : 'block';
        }

        els.btnResetView.style.display = (Math.abs(userTiltX) > 2 || Math.abs(userTiltY) > 2) ? 'inline-flex' : 'none';

        let tip = '';
        if (wishMsg) tip = wishMsg;
        else if (openingInProgress) tip = '正在准备吹蜡烛麦克风，请在弹窗中点击允许或跳过';
        else if (!isChristmas && blowing) tip = '轻轻吹气中，继续按住即可吹灭蜡烛';
        else if (!isChristmas && isOpen && candleLit && micActive) tip = '对着麦克风轻轻吹气即可吹灭蜡烛';
        else if (!isOpen) tip = topFold ? '' : (isChristmas ? '轻触封面翻开立体圣诞贺卡' : '轻触封面翻开立体生日贺卡');

        els.statusText.textContent = tip;
        els.statusPill.classList.toggle('hidden', !tip);
        els.statusDot.classList.toggle('blowing', !isChristmas && blowing);
        els.statusDot.classList.toggle('mic-live', !isChristmas && !blowing && (micActive || openingInProgress) && !wishMsg);
        els.micMeterTrack.classList.toggle('show', !isChristmas && isOpen && candleLit && micActive && !wishMsg && !blowing);
      }
      syncUI();

      /* 9. 交互与防穿模点击命中绑定 */
      /**
       * 翻开或合上贺卡：
       * 生日模式点击翻开时，先在翻开动画开始之前完成麦克风预授权（最多等待 5 秒防内置浏览器卡死），
       * 授权或跳过结束后再完整翻开贺卡并从头播放饱满音量的八音盒，彻底不打断惊喜动画。
       */
      async function toggleCard() {
        if (openingInProgress) return;
        if (isOpen) {
          isOpen = false;
          stopMicDetector();
          cancelHoldBlow(false);
          stopMusic();
          syncUI();
          return;
        }

        // 在用户点击手势同步周期内先激活 Web Audio，避免后续 await 导致移动端静音
        const audioCtx = ensureAudioCtx();
        const canPreAuth = (
          !isChristmas &&
          candleLit &&
          !micPermissionDenied &&
          window.isSecureContext &&
          navigator.mediaDevices &&
          typeof navigator.mediaDevices.getUserMedia === 'function'
        );

        let preStream = null;
        if (canPreAuth) {
          openingInProgress = true;
          micAutoAttempted = true;
          const preSession = ++micSessionId;
          syncUI();
          try {
            preStream = await requestMicStreamSafe(preSession, MIC_AUTH_TIMEOUT_MS);
          } catch {
            preStream = null;
          } finally {
            openingInProgress = false;
          }
          // 若等待授权期间已被其他操作作废，立刻清理音轨
          if (preSession !== micSessionId) {
            stopStreamTracks(preStream);
            syncUI();
            return;
          }
        }

        isOpen = true;
        startMusic();
        if (preStream && !isChristmas && candleLit) {
          startMicWithStream(preStream, audioCtx);
        } else if (preStream) {
          stopStreamTracks(preStream);
        }
        syncUI();
      }

      /**
       * 打开手工棉麻毛边刺绣祝福信弹窗，并将滚动条回顶
       */
      function openLetter() {
        cancelHoldBlow(false);
        setEditorVisible(false);
        const modal = document.getElementById('letterModal');
        modal.classList.add('open');
        modal.scrollTop = 0;
      }

      /**
       * 判定点击坐标是否命中指定 3D 元素投影包围盒
       *
       * @param {HTMLElement} el - 3D 元素
       * @param {number} cx - 视口 X
       * @param {number} cy - 视口 Y
       * @param {number} [topPad=14] - 顶部容差
       * @returns {boolean} 是否命中
       */
      function isPointInRect(el, cx, cy, topPad = 14) {
        const r = el.getBoundingClientRect();
        return cx >= r.left - 12 && cx <= r.right + 12 && cy >= r.top - topPad && cy <= r.bottom + 12;
      }

      /**
       * 长按松手后短暂重置 click 抑制，确保不吞掉下一次点击
       *
       * @param {'btn'|'cake'} kind - 来源
       */
      function scheduleSuppressReset(kind) {
        if (kind === 'btn') {
          if (suppressPropTimer) clearTimeout(suppressPropTimer);
          suppressPropTimer = setTimeout(() => { suppressPropClick = false; suppressPropTimer = null; }, 160);
        } else {
          if (suppressStageTimer) clearTimeout(suppressStageTimer);
          suppressStageTimer = setTimeout(() => { suppressStageClick = false; suppressStageTimer = null; }, 160);
        }
      }

      window.addEventListener('pagehide', () => { stopMicDetector(); cancelHoldBlow(false); });
      document.addEventListener('visibilitychange', () => { if (document.hidden) cancelHoldBlow(false); });
      document.getElementById('btnToggleOpen').onclick = toggleCard;
      document.getElementById('btnMusic').onclick = () => (musicPlaying ? stopMusic() : startMusic());
      document.getElementById('btnResetView').onclick = () => { userTiltX = 0; userTiltY = 0; syncUI(); };
      document.getElementById('btnLetter').onclick = openLetter;

      const btnPropEl = document.getElementById('btnPropAction');
      btnPropEl.addEventListener('contextmenu', (e) => e.preventDefault());
      btnPropEl.addEventListener('pointerdown', (e) => {
        if (isChristmas || (e.pointerType === 'mouse' && e.button !== 0)) return;
        suppressPropClick = false;
        if (suppressPropTimer) { clearTimeout(suppressPropTimer); suppressPropTimer = null; }
        holdFinishedOrigin = null;
        if (!isOpen || !candleLit) return;
        ensureAudioCtx();
        blowOrigin = 'btn';
        blowHoldTimer = setTimeout(startHoldBlow, HOLD_START_MS);
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => {
        btnPropEl.addEventListener(ev, () => {
          if (isChristmas) return;
          if (holdFinishedOrigin === 'btn') {
            holdFinishedOrigin = null; suppressPropClick = true; scheduleSuppressReset('btn'); return;
          }
          if (blowOrigin !== 'btn') return;
          if (blowing) { suppressPropClick = true; scheduleSuppressReset('btn'); }
          cancelHoldBlow(false);
        });
      });
      btnPropEl.addEventListener('click', () => {
        if (isChristmas) { triggerChristmasStarWish(); return; }
        if (suppressPropClick) {
          suppressPropClick = false;
          if (suppressPropTimer) { clearTimeout(suppressPropTimer); suppressPropTimer = null; }
          return;
        }
        toggleCandle();
      });

      els.prop.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          if (!isOpen) return;
          if (isChristmas) triggerChristmasStarWish(); else toggleCandle();
        }
      });

      const letterColsEl = document.querySelector('.letter-cols');
      const letterModalEl = document.getElementById('letterModal');
      function setEditorVisible(show) {
        document.getElementById('editorBox').classList.toggle('show', show);
        letterColsEl.classList.toggle('mobile-editing', show);
        if (show) {
          setTimeout(() => { letterModalEl.scrollTop = 0; }, 30);
        }
      }
      // 手机端点击任一输入框弹出软键盘时，自动平滑滚入视口中央不被键盘遮挡
      document.querySelectorAll('#editorBox .ed-input, #editorBox .ed-area').forEach((field) => {
        field.addEventListener('focus', () => {
          setTimeout(() => {
            try { field.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch {}
          }, 260);
        });
      });
      document.getElementById('btnCloseLetter').onclick = () => {
        document.getElementById('letterModal').classList.remove('open');
        setEditorVisible(false);
      };
      document.getElementById('btnEditToggle').onclick = () => {
        const eb = document.getElementById('editorBox');
        const show = !eb.classList.contains('show');
        if (show) {
          document.getElementById('inRecipient').value = blessing.recipient || '';
          document.getElementById('inLines').value = (blessing.lines || []).join('\n');
          document.getElementById('inClosing').value = blessing.closing || '';
          document.getElementById('inSig').value = blessing.signature || '';
          document.getElementById('inSubSig').value = blessing.subSignature || '';
        }
        setEditorVisible(show);
      };
      document.getElementById('btnSaveTxt').onclick = () => {
        blessing = {
          recipient: document.getElementById('inRecipient').value.trim(),
          lines: document.getElementById('inLines').value.split('\n').map((s) => s.trim()).filter(Boolean),
          closing: document.getElementById('inClosing').value.trim(),
          signature: document.getElementById('inSig').value.trim(),
          subSignature: document.getElementById('inSubSig').value.trim()
        };
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(blessing)); } catch {}
        renderBlessing();
        setEditorVisible(false);
      };
      document.getElementById('btnResetTxt').onclick = () => {
        blessing = JSON.parse(JSON.stringify(cfg.blessing || {}));
        try { localStorage.removeItem(STORAGE_KEY); } catch {}
        renderBlessing();
        setEditorVisible(false);
      };

      const stage = document.getElementById('stageWrap');
      stage.addEventListener('contextmenu', (e) => {
        if (isOpen && (isPointInRect(els.prop, e.clientX, e.clientY, 18) || isPointInRect(els.env, e.clientX, e.clientY, 16))) {
          e.preventDefault();
        }
      });
      stage.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        suppressStageClick = false;
        if (suppressStageTimer) { clearTimeout(suppressStageTimer); suppressStageTimer = null; }
        dragging = true; sx = e.clientX; sy = e.clientY; bx = userTiltX; by = userTiltY; moved = 0; stage.classList.add('dragging');
        if (!isChristmas && isOpen && candleLit && isPointInRect(els.prop, e.clientX, e.clientY, 18)) {
          ensureAudioCtx();
          holdFinishedOrigin = null;
          blowOrigin = 'cake';
          blowHoldTimer = setTimeout(startHoldBlow, HOLD_START_MS);
        }
      });
      stage.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - sx, dy = e.clientY - sy; moved = Math.hypot(dx, dy);
        if (moved >= 10 && blowOrigin === 'cake') cancelHoldBlow(false);
        // 安全防穿模与防小屏出界视角钳制
        const isNarrow = window.innerWidth <= 520;
        const maxY = isNarrow ? 14 : 24;
        const minX = isNarrow ? -10 : -16;
        const maxX = isNarrow ? 12 : 18;
        userTiltY = Math.max(-maxY, Math.min(maxY, by + dx * 0.13));
        userTiltX = Math.max(minX, Math.min(maxX, bx - dy * 0.11));
        syncUI();
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => stage.addEventListener(ev, () => {
        dragging = false; stage.classList.remove('dragging');
        if (isChristmas) return;
        if (holdFinishedOrigin === 'cake') {
          holdFinishedOrigin = null; suppressStageClick = true; scheduleSuppressReset('cake'); return;
        }
        if (blowOrigin === 'cake') {
          if (blowing) { suppressStageClick = true; scheduleSuppressReset('cake'); }
          cancelHoldBlow(false);
        }
      }));

      stage.addEventListener('click', (e) => {
        if (suppressStageClick) {
          suppressStageClick = false;
          if (suppressStageTimer) { clearTimeout(suppressStageTimer); suppressStageTimer = null; }
          return;
        }
        if (moved >= 10) return;
        if (!isOpen) { toggleCard(); return; }
        const cx = e.clientX, cy = e.clientY;
        if (isPointInRect(els.prop, cx, cy, 18)) {
          if (isChristmas) triggerChristmasStarWish(); else toggleCandle();
          return;
        }
        if (isPointInRect(els.env, cx, cy, 16)) {
          openLetter();
        }
      });

      /* 暴露轻量调试与自动化验证接口 */
      window.__cardDebug = {
        getState: () => ({
          occasion: cfg.occasion || 'birthday',
          fold: cfg.fold || 'horizontal',
          isOpen, openProgress, candleLit, blowing, blowProgress,
          micActive, micLevel, starLightsOn, musicPlaying, usePhotoLinen,
          userTiltX, userTiltY, layout: { ...layout }
        }),
        setTilt: (tx, ty) => { userTiltX = tx; userTiltY = ty; syncUI(); },
        startMicWithStream,
        stopMicDetector,
        startHoldBlow,
        cancelHoldBlow,
        extinguishCandle,
        toggleCandle,
        triggerChristmasStarWish,
        openLetter,
        toggleCard
      };
    })();
  </script>
</body>
</html>
