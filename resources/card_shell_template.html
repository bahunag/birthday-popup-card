<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>生日快乐 · 手绘立体纸艺贺卡</title>
  <style>
    /**
     * Apple 极简留白设计令牌与纸艺 3D 防穿模样式系统
     * 设计准则：清晰（Clarity）、克制（Deference）、深度（Depth）、Less is More
     * 规范约束：全页面严禁使用任何 Emoji 表情符号做图标，统一采用 1.6px 纯矢量 SVG 线条图标
     */
    :root {
      --bg-inner: #e7d7bf;
      --bg-outer: #ceb693;
      --paper-cream: #faf6ec;
      --ink-primary: #2f2923;
      --ink-secondary: #6b6156;
      --accent-primary: #4f7348;
      --accent-secondary: #b5496b;
      --wax-seal: #b9382e;
      --inside-filter: none;
      --glass-bg: rgba(252, 249, 243, 0.84);
      --glass-border: rgba(120, 105, 88, 0.18);
      --glass-shadow: 0 10px 32px rgba(48, 38, 26, 0.11), 0 2px 6px rgba(48, 38, 26, 0.05);
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-hand-zh: "STKaiti", "KaiTi", "Kaiti SC", "FangSong", "PingFang SC", cursive;
      --font-hand-en: Georgia, "Times New Roman", serif;
      --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: var(--font-sans); color: var(--ink-primary);
      background:
        repeating-linear-gradient(180deg, rgba(255,248,236,0.22) 0px, rgba(255,248,236,0.22) 2px, rgba(165,134,96,0.06) 2px, rgba(165,134,96,0.06) 11px),
        radial-gradient(circle at 50% 44%, var(--bg-inner) 0%, var(--bg-outer) 100%);
      -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }

    .app-shell {
      position: relative; width: 100vw; height: 100dvh;
      display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
    }

    /* ==================== 顶部克制提示条与极简气流感应条 ==================== */
    .top-bar {
      position: relative; z-index: 20; display: flex; justify-content: center;
      min-height: 44px; padding-top: max(12px, env(safe-area-inset-top)); padding-inline: 16px; pointer-events: none;
    }
    .status-pill {
      display: inline-flex; align-items: center; gap: 8px; padding: 7px 15px; border-radius: 999px;
      background: var(--glass-bg); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
      font-size: 12.5px; color: var(--ink-secondary); transition: opacity 0.28s ease, transform 0.28s ease;
    }
    .status-pill.hidden { opacity: 0; transform: translateY(-6px); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-primary); flex-shrink: 0; }
    .status-dot.blowing { background: #d97a2b; box-shadow: 0 0 0 4px rgba(217,122,43,0.22); animation: blowPulse 0.7s ease-in-out infinite alternate; }
    .status-dot.mic-live { background: #c94c44; box-shadow: 0 0 0 4px rgba(201,76,68,0.2); animation: blowPulse 1s ease-in-out infinite alternate; }
    @keyframes blowPulse { 0% { transform: scale(0.9); } 100% { transform: scale(1.25); } }

    .mic-meter-track {
      display: none; width: 46px; height: 4px; border-radius: 999px;
      background: rgba(120, 105, 88, 0.2); overflow: hidden; flex-shrink: 0;
    }
    .mic-meter-track.show { display: inline-block; }
    .mic-meter-fill {
      height: 100%; width: 4%; border-radius: 999px;
      background: linear-gradient(90deg, #e09d44, #d14c3e);
      transition: width 0.06s linear;
    }

    /* 空中温暖星尘微光 */
    .sparkles { position: fixed; inset: 0; pointer-events: none; z-index: 4; opacity: 0; transition: opacity 0.6s ease; }
    .sparkles.show { opacity: 1; }
    .sparkle-dot {
      position: absolute; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,253,245,0.95) 0%, rgba(255,240,200,0) 75%);
      box-shadow: 0 0 8px rgba(255,248,224,0.7);
      animation: twinkle 4s ease-in-out infinite alternate;
    }
    @keyframes twinkle { 0% { opacity: 0.25; transform: scale(0.8); } 100% { opacity: 0.95; transform: scale(1.25); } }

    /* ==================== 3D 舞台（严格 3 级保真层级，适配 Safari WebKit） ==================== */
    .stage-wrap {
      flex: 1; width: 100%; min-height: 0; position: relative; z-index: 10;
      display: flex; align-items: center; justify-content: center; perspective: 1850px;
      cursor: grab; touch-action: none;
    }
    .stage-wrap.dragging { cursor: grabbing; }
    .card-rig {
      position: relative; width: 0; height: 0;
      transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
      will-change: transform;
    }

    .table-shadow {
      position: absolute; left: -430px; top: -268px; height: 550px; border-radius: 24px;
      background: radial-gradient(ellipse at center, rgba(64,45,24,0.28) 0%, rgba(64,45,24,0.11) 54%, transparent 76%);
      filter: blur(18px); pointer-events: none;
    }

    /* 默认横版左右对折卡纸页：单页 430x540，展开 860x540 */
    .card-leaf {
      position: absolute; top: -270px; width: 430px; height: 540px;
      transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
    }
    .left-leaf { left: -430px; transform-origin: 100% 50%; }
    .right-leaf { left: 0px; transform-origin: 0% 50%; }

    .leaf-face {
      position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: 6px; background: var(--paper-cream); overflow: hidden;
    }
    .leaf-outside { transform: rotateY(180deg) translateZ(1.5px); box-shadow: 0 6px 22px rgba(45,34,22,0.18), inset 0 0 0 1px rgba(138,118,92,0.28); }
    .left-leaf .leaf-inside { border-top-right-radius: 2px; border-bottom-right-radius: 2px; box-shadow: inset 0 0 0 1px rgba(138,118,92,0.22); }
    .right-leaf .leaf-inside { border-top-left-radius: 2px; border-bottom-left-radius: 2px; box-shadow: inset 0 0 0 1px rgba(138,118,92,0.22); }

    .paper-frame { width: 100%; height: 100%; padding: 8px; background: linear-gradient(145deg, #fcf9f2, #f4ede0); position: relative; }
    .left-leaf .paper-frame { padding-right: 0; }
    .right-leaf .paper-frame { padding-left: 0; }
    .cover-frame { width: 100%; height: 100%; position: relative; }
    .art-img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 3px; }
    .inside-art { filter: var(--inside-filter); }
    .paper-grain {
      position: absolute; inset: 0; pointer-events: none; opacity: 0.22; mix-blend-mode: multiply;
      background-image: radial-gradient(rgba(128,108,82,0.14) 1px, transparent 0), radial-gradient(rgba(160,140,110,0.1) 1px, transparent 0);
      background-size: 16px 16px, 23px 23px; background-position: 0 0, 7px 11px;
    }
    .spine-left { position: absolute; top: 0; right: 0; width: 32px; height: 100%; background: linear-gradient(to left, rgba(52,38,24,0.32) 0%, rgba(52,38,24,0.08) 45%, transparent 100%); pointer-events: none; }
    .spine-right { position: absolute; top: 0; left: 0; width: 32px; height: 100%; background: linear-gradient(to right, rgba(52,38,24,0.3) 0%, rgba(52,38,24,0.08) 45%, transparent 100%); pointer-events: none; }
    .edge-side { position: absolute; top: 2px; bottom: 2px; width: 4px; background: linear-gradient(to right, #dfd5c3, #faf6ec, #cfc3ad); pointer-events: none; }
    .edge-l { left: 0; transform: rotateY(-90deg); transform-origin: left center; }
    .edge-r { right: 0; transform: rotateY(90deg); transform-origin: right center; }

    /* ==================== 新版上下翻折：标准横向 4:3 长方形矩形贺卡 (560x420 单页, 560x840 展开) ==================== */
    .top-fold .stage-wrap { perspective: 2200px; }
    .top-fold .card-leaf { left: -280px; width: 560px; height: 420px; }
    .top-fold .left-leaf { top: -420px; transform-origin: 50% 100%; }
    .top-fold .right-leaf { top: 0; transform-origin: 50% 0; }
    .top-fold .leaf-outside { transform: rotateX(180deg) translateZ(1.5px); }
    .top-fold .left-leaf .leaf-inside { border-radius: 6px 6px 0 0; }
    .top-fold .right-leaf .leaf-inside { border-radius: 0 0 6px 6px; }
    .top-fold .left-leaf .paper-frame { padding: 7px 7px 0; }
    .top-fold .right-leaf .paper-frame { padding: 0 7px 7px; }
    .top-fold .inside-art { object-fit: cover; }
    .top-fold .spine-left, .top-fold .spine-right { width: 100%; height: 24px; left: 0; }
    .top-fold .spine-left { top: auto; bottom: 0; background: linear-gradient(to top, rgba(72,54,32,0.32), rgba(72,54,32,0.08) 42%, transparent); }
    .top-fold .spine-right { top: 0; background: linear-gradient(to bottom, rgba(72,54,32,0.28), rgba(72,54,32,0.07) 42%, transparent); }
    .top-fold .edge-side { display: none; }
    .top-fold .table-shadow { left: -292px; top: -8px; width: 584px; height: 444px; }

    .cover-tip {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px;
      background: rgba(252,249,242,0.88); backdrop-filter: blur(10px);
      border: 1px solid rgba(110,88,66,0.22); box-shadow: 0 5px 14px rgba(48,36,24,0.12);
      font-size: 12px; color: #3f4b34; white-space: nowrap; transition: opacity 0.25s ease;
    }
    .back-cover { display: flex; align-items: flex-end; justify-content: center; padding-bottom: 24px; background: linear-gradient(160deg, #f8f3e7, #ede4d2); }
    .back-stamp { font-family: var(--font-hand-en); font-style: italic; font-size: 14.5px; color: rgba(108,92,74,0.62); }

    /* ==================== 4 层零穿模立体弹出舞台（全部正向 Z 堆叠，绝不捅穿底页） ==================== */
    .popup-stage {
      position: absolute; left: 0; top: 0; width: 0; height: 0;
      transform-style: preserve-3d; -webkit-transform-style: preserve-3d; pointer-events: none;
    }
    .popup-plane {
      position: absolute; left: 0; top: 0;
      transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
      transform-origin: 50% 100% 0px;
    }
    .popup-hidden { visibility: hidden !important; pointer-events: none !important; }

    /* 正向层叠卡纸厚边：0 -> +1.2px -> +2.4px -> 正面 +3.6px，零负 Z 穿底 */
    .thickness-layer {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none;
    }
    .back-t3 { transform: translateZ(0px); filter: brightness(0) invert(0.89) sepia(0.15) saturate(0.5); }
    .back-t2 { transform: translateZ(1.2px); filter: brightness(0) invert(0.93) sepia(0.12) saturate(0.45); }
    .back-t1 { transform: translateZ(2.4px); filter: brightness(0) invert(0.96) sepia(0.1) saturate(0.4); }

    /* 中央人物下方柔和投影 */
    .char-shadow {
      position: absolute; left: -120px; top: -54px; width: 240px; height: 108px; border-radius: 50%;
      background: radial-gradient(ellipse, rgba(48,36,22,0.28) 0%, rgba(48,36,22,0.09) 52%, transparent 74%);
      filter: blur(8px); pointer-events: none;
    }

    /* Layer 1：后景花环拱门 */
    .arch-layer { width: 520px; height: 310px; margin-left: -260px; margin-top: -310px; }
    .arch-front-wrap { position: relative; width: 100%; height: 100%; transform: translateZ(3.6px); }
    .arch-img { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(0 5px 9px rgba(42,32,20,0.15)); }

    /* Layer 2：正中央立体主角人物 */
    .char-layer { width: 240px; height: 300px; margin-left: -120px; margin-top: -300px; }
    .char-front-wrap { position: relative; width: 100%; height: 100%; transform: translateZ(3.6px); }
    .char-img { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(0 7px 12px rgba(42,30,18,0.18)); }
    .char-fold-hint {
      position: absolute; top: 8%; bottom: 4%; left: 50%; width: 2px; pointer-events: none; mix-blend-mode: soft-light;
      background: linear-gradient(to right, rgba(90,72,52,0.07), rgba(255,253,248,0.22));
    }

    /* Layer 3：左前立体道具槽位（生日蛋糕木桌 或 圣诞星星灯树，严格贴合左页/下页平面） */
    .prop-slot {
      --prop-width: 160px; --prop-height: 192px;
      position: absolute; left: 0; top: 0;
      transform-style: preserve-3d; -webkit-transform-style: preserve-3d; pointer-events: none;
    }
    .prop-layer {
      width: var(--prop-width); height: var(--prop-height);
      margin-left: calc(var(--prop-width) / -2); margin-top: calc(-1 * var(--prop-height));
      cursor: pointer; pointer-events: auto; -webkit-touch-callout: none;
    }
    .prop-front-wrap { position: relative; width: 100%; height: 100%; transform: translateZ(3.6px); }
    .prop-img { width: 100%; height: 100%; object-fit: fill; display: block; filter: drop-shadow(0 6px 10px rgba(45,32,18,0.18)); }
    .prop-contact-shadow {
      position: absolute; left: calc(var(--prop-width) * -0.46); top: calc(var(--prop-width) * -0.07);
      width: calc(var(--prop-width) * 0.92); height: calc(var(--prop-width) * 0.14);
      background: radial-gradient(ellipse, rgba(50,36,22,0.34), rgba(50,36,22,0.1) 50%, transparent 74%);
      transform: translateZ(0.5px); pointer-events: none;
    }

    /* 生日模式：动态蜡烛火焰与轻烟 */
    .wick-anchor { position: absolute; left: 44.6%; top: 7.5%; width: 0; height: 0; z-index: 12; pointer-events: none; }
    .flame-wrap { position: relative; transition: transform 0.22s ease-out, opacity 0.22s ease-out; transform-origin: 0px 0px; }
    .flame-wrap.is-blowing { transition: transform 0.05s linear, opacity 0.08s linear; }
    .flame-halo { position: absolute; width: 42px; height: 42px; left: -21px; top: -30px; border-radius: 50%; background: radial-gradient(circle, rgba(255,218,96,0.88), rgba(255,146,40,0.3) 50%, transparent 75%); transition: transform 0.14s ease-out, opacity 0.14s ease-out; }
    .flame-drop {
      position: absolute; width: 13px; height: 22px; left: -6.5px; top: -21px;
      border-radius: 50% 50% 40% 40% / 68% 68% 32% 32%;
      background: radial-gradient(ellipse at 50% 72%, #fffef6 0%, #ffd854 42%, #ff881a 85%);
      box-shadow: 0 0 12px rgba(255,174,46,0.92); animation: flicker 1.1s ease-in-out infinite alternate;
    }
    .flame-core { position: absolute; width: 5px; height: 9px; left: 4px; top: 8px; border-radius: 50%; background: rgba(255,255,255,0.92); }
    @keyframes flicker { 0% { transform: rotateZ(-3deg) scale(0.96, 1.04); } 100% { transform: rotateZ(2deg) scale(1.03, 0.98); } }
    .smoke-dot {
      position: absolute; width: 9px; height: 9px; left: -4.5px; top: -8px; border-radius: 50%;
      background: radial-gradient(circle, rgba(145,138,128,0.68), transparent 74%); animation: smoke 2.2s ease-out infinite;
    }
    .smoke-dot.s2 { animation-delay: 0.7s; left: -2px; }
    .smoke-dot.s3 { animation-delay: 1.4s; left: -6px; }
    @keyframes smoke { 0% { transform: translateY(0) scale(0.5); opacity: 0.8; } 100% { transform: translate(5px, -36px) scale(2.2); opacity: 0; } }

    /* 圣诞模式：立体圣诞树常亮闪烁星星灯（纯矢量星芒 + 暖金光晕，零 Emoji） */
    .tree-lights-layer {
      position: absolute; inset: 0; z-index: 14; pointer-events: none; transition: opacity 0.45s ease;
    }
    .tree-lights-layer.lights-off { opacity: 0.14; }
    .tree-top-star {
      position: absolute; width: 28px; height: 28px; transform: translate(-50%, -50%);
      display: flex; align-items: center; justify-content: center;
      animation: starTopGlow 2.1s ease-in-out infinite alternate;
    }
    .tree-top-star::before {
      content: ""; position: absolute; inset: -10px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,232,140,0.82) 0%, rgba(255,190,72,0.28) 48%, transparent 74%);
    }
    .star-light-node {
      position: absolute; transform: translate(-50%, -50%);
      border-radius: 50%;
      animation: starTwinkle var(--dur, 1.8s) ease-in-out var(--delay, 0s) infinite alternate;
    }
    .star-light-node::before {
      content: ""; position: absolute; inset: -5px; border-radius: 50%;
      background: radial-gradient(circle, var(--glow, rgba(255,226,130,0.9)) 0%, transparent 72%);
    }
    .star-light-node::after {
      content: ""; position: absolute; inset: 0;
      background: var(--core, #fffef2);
      clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);
      box-shadow: 0 0 6px rgba(255,232,142,0.95);
    }
    .tree-lights-layer.lights-burst .tree-top-star { animation-duration: 0.65s; transform: translate(-50%, -50%) scale(1.24); }
    .tree-lights-layer.lights-burst .star-light-node { animation-duration: 0.55s; }
    @keyframes starTopGlow {
      0% { transform: translate(-50%, -50%) scale(0.92); opacity: 0.84; }
      100% { transform: translate(-50%, -50%) scale(1.12); opacity: 1; }
    }
    @keyframes starTwinkle {
      0% { transform: translate(-50%, -50%) scale(0.68); opacity: 0.56; }
      50% { transform: translate(-50%, -50%) scale(1.06); opacity: 0.94; }
      100% { transform: translate(-50%, -50%) scale(1.28); opacity: 1; }
    }

    /* Layer 4：右前爱心火漆信封（严格贴合右页/下页平面，永不插进底纸） */
    .env-slot {
      position: absolute; left: 0; top: 0;
      transform-style: preserve-3d; -webkit-transform-style: preserve-3d; pointer-events: none;
    }
    .envelope-layer {
      width: 132px; height: 100px; margin-left: -66px; margin-top: -100px;
      cursor: pointer; pointer-events: auto; -webkit-touch-callout: none;
    }
    .env-contact-shadow {
      position: absolute; left: -64px; top: -8px; width: 128px; height: 16px;
      background: radial-gradient(ellipse, rgba(50,36,22,0.3), transparent 74%);
      transform: translateZ(0.5px); pointer-events: none;
    }
    .peeking-note {
      position: absolute; left: 13px; top: -21px; width: 104px; height: 74px;
      background: #f3ede0; border: 1px solid #bfb39c; border-radius: 3px; padding: 5px;
      box-shadow: 0 3px 8px rgba(45,34,22,0.16); transform: translateZ(1.2px) rotate(-3.2deg); transition: transform 0.3s var(--ease-spring);
    }
    .envelope-layer:hover .peeking-note { transform: translateZ(1.2px) translateY(-9px) rotate(-2deg); }
    .note-stitch {
      width: 100%; height: 100%; border: 1px dashed #b9ab94;
      display: flex; flex-direction: column; align-items: center; padding-top: 4px; gap: 2px;
    }
    .note-mini-txt { font-family: var(--font-hand-en); font-size: 8.5px; font-weight: 700; color: #4c3e32; letter-spacing: 0.03em; white-space: nowrap; }
    .envelope-body {
      position: absolute; left: 0; right: 0; bottom: 0; height: 78px;
      background: linear-gradient(160deg, #faf4e6, #eadfcb); border: 1.4px solid #8a7962; border-radius: 4px;
      box-shadow: 0 6px 14px rgba(48,35,22,0.22), inset 0 1px 0 rgba(255,255,255,0.7);
      display: flex; align-items: center; justify-content: center; transform: translateZ(2.4px);
      transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
    }
    .envelope-flap {
      position: absolute; top: 0; left: 0; right: 0; height: 42px;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      background: linear-gradient(180deg, rgba(255,252,245,0.6), rgba(226,214,192,0.45));
      border-bottom: 1.2px solid rgba(138,121,98,0.5); transform: translateZ(0.8px);
    }
    .wax-seal {
      position: relative; z-index: 5; margin-top: 8px; width: 27px; height: 27px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #df6156 0%, var(--wax-seal) 78%, #6e1a13 100%);
      border: 1.5px solid #f7ede0; box-shadow: 0 2px 6px rgba(82,24,18,0.35);
      display: flex; align-items: center; justify-content: center; transform: translateZ(2.5px);
    }

    /* ==================== 底部极简毛玻璃控制坞（4 键纯净、零滚动条、零 Emoji） ==================== */
    .bottom-dock {
      position: relative; z-index: 25; display: flex; justify-content: center;
      padding-bottom: max(14px, env(safe-area-inset-bottom)); padding-inline: 10px;
    }
    .dock-bar {
      display: inline-flex; align-items: center; flex-wrap: nowrap; justify-content: center;
      gap: 3px; padding: 5px 6px; border-radius: 999px;
      background: var(--glass-bg); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
      max-width: calc(100vw - 16px); overflow: hidden;
    }
    .dock-div { width: 1px; height: 15px; background: rgba(120,104,84,0.18); margin-inline: 1px; flex-shrink: 0; }
    .dock-btn {
      display: inline-flex; align-items: center; gap: 4px; padding: 6px 11px; border-radius: 999px;
      border: none; background: transparent; color: var(--ink-primary); font-size: 12px; font-weight: 500;
      white-space: nowrap; flex-shrink: 0; cursor: pointer; touch-action: manipulation; -webkit-touch-callout: none;
      transition: background 0.2s ease, transform 0.16s ease;
    }
    .dock-btn:hover { background: rgba(255,253,249,0.92); transform: translateY(-1px); }
    .dock-btn:active { transform: translateY(0); }

      position: absolute; top: -20px; border-radius: 75% 15% 70% 25%; opacity: 0.85;
      animation: fall 3.8s ease-in-out forwards;
    }
    .petal.snow-flake { border-radius: 50%; box-shadow: 0 0 6px rgba(255,253,246,0.9); }
    @keyframes fall { 0% { transform: translate(0, -10px) rotate(0deg); opacity: 0; } 15% { opacity: 0.92; } 100% { transform: translate(var(--dx), 102vh) rotate(320deg); opacity: 0; } }

    /* ==================== 手工棉麻毛边刺绣祝福信弹窗（支持手机原生上下滑动、双主题 0 穿帮） ==================== */

      position: fixed; inset: 0; z-index: 60; background: rgba(16,14,12,0.84);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);

    }
    .modal-mask.open { display: flex; }
    .letter-shell {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      width: min(920px, 100%); margin: auto 0; flex-shrink: 0;
    }
    .letter-actions { display: flex; gap: 8px; justify-content: flex-end; width: 100%; }
    .dark-pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border-radius: 999px;

    .letter-cols { display: flex; align-items: center; justify-content: center; gap: 22px; flex-wrap: wrap; }

    /* 真毛边棉麻布贴渲染模式 */
    .linen-photo-card {
      position: relative; width: min(420px, 84vw, 59vh); aspect-ratio: 748 / 1023;
      filter: drop-shadow(0 22px 42px rgba(0,0,0,0.62)); display: none;
    }
    .linen-photo-card.active { display: block; }
    .linen-fabric-img { width: 100%; height: 100%; object-fit: contain; display: block; }

    /* 圣诞模式专属：在纯空白毛边棉麻底布上半区以同款深炭棕棉线绣出小圣诞树与 MERRY CHRISTMAS */
    .christmas-embroidery-header {
      display: none; position: absolute; top: 12.5%; left: 13%; right: 13%; height: 26%;
      align-items: center; justify-content: center; gap: 12px;
      color: #29231e; filter: url(#fray-edge-filter); mix-blend-mode: multiply; pointer-events: none;
    }
    .christmas-embroidery-header.show { display: flex; }
    .xmas-stitch-title {
      font-family: var(--font-hand-en); font-size: clamp(14px, 2vw, 20px); font-weight: 700;
      letter-spacing: 0.08em; line-height: 1.35; color: #29231e;
      text-shadow: 0 0.8px 0 rgba(255,252,244,0.75), 0.4px 0.6px 0.7px rgba(32,24,16,0.34);
    }

    .embroidered-overlay {
      position: absolute; top: 40.5%; bottom: 16%; left: 12.8%; right: 12.8%;
      display: flex; flex-direction: column; justify-content: space-between;
      color: #29231e; font-family: var(--font-hand-zh);
      text-shadow: 0 0.9px 0 rgba(255,252,244,0.78), 0.4px 0.6px 0.8px rgba(32,24,16,0.36);
      filter: url(#fray-edge-filter); mix-blend-mode: multiply; pointer-events: none;
    }

    /* 无贴图回退时的高仿真 CSS 亚麻布贴 */
    .linen-css-card {
      position: relative; width: min(390px, 86vw); aspect-ratio: 3 / 4; padding: 14px;
      background:
        repeating-linear-gradient(0deg, rgba(160,146,125,0.08) 0px, rgba(160,146,125,0.08) 1px, transparent 1px, transparent 3px),
        repeating-linear-gradient(90deg, rgba(160,146,125,0.08) 0px, rgba(160,146,125,0.08) 1px, transparent 1px, transparent 3px),
        radial-gradient(circle at 40% 35%, #f5efe3 0%, #eae1cf 100%);
      border-radius: 4px; box-shadow: 0 22px 44px rgba(0,0,0,0.6), 0 0 0 2px rgba(244,238,225,0.45);
      filter: url(#fray-edge-filter); display: none; flex-direction: column;
    }

    .linen-stitch-frame {
      flex: 1; border: 2px dashed #cbbba2; border-radius: 2px; padding: 16px 20px;

    .linen-body {
      flex: 1; display: flex; flex-direction: column; justify-content: space-between;
      padding: 12px 4px 6px; color: #29231e; font-family: var(--font-hand-zh);

    .l-recipient { font-size: clamp(16px, 1.9vw, 19.5px); text-align: left; padding-left: 4%; transform: rotate(-0.8deg); }
    .l-lines { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: clamp(14px, 1.65vw, 17.5px); line-height: 1.32; text-align: center; }
    .l-lines p:nth-child(odd) { transform: rotate(-0.45deg); }
    .l-lines p:nth-child(even) { transform: rotate(0.4deg); }
    .l-closing { font-size: clamp(15.5px, 1.85vw, 19px); text-align: center; transform: rotate(-0.5deg); }
    .l-sig { align-self: flex-end; text-align: center; line-height: 1.15; padding-right: 7%; transform: rotate(-1deg); }
    .l-sig-main { font-size: clamp(15px, 1.75vw, 18px); display: block; }
    .l-sig-sub { font-family: var(--font-hand-en); font-size: clamp(13.5px, 1.55vw, 16px); display: block; }

    @media (max-width: 420px), (max-height: 580px) {
      .embroidered-overlay .l-recipient, .embroidered-overlay .l-closing { font-size: 13px; line-height: 1.18; }
      .embroidered-overlay .l-lines { font-size: 12px; line-height: 1.24; gap: 1px; }
      .embroidered-overlay .l-sig-main { font-size: 12px; }
      .embroidered-overlay .l-sig-sub { font-size: 11px; }
    }

    /* 长文本祝福语自动微缩档位，确保在刺绣框内完整清晰不裁切 */
    .linen-photo-card.text-dense .l-lines,
    .linen-css-card.text-dense .l-lines { font-size: clamp(12px, 1.38vw, 14.5px); line-height: 1.22; gap: 2px; }
    .linen-photo-card.text-dense .l-recipient,
    .linen-photo-card.text-dense .l-closing,
    .linen-css-card.text-dense .l-recipient,
    .linen-css-card.text-dense .l-closing { font-size: clamp(13.5px, 1.55vw, 16px); }

    .linen-photo-card.text-compact .l-lines,
    .linen-css-card.text-compact .l-lines { font-size: clamp(10.5px, 1.15vw, 12.8px); line-height: 1.16; gap: 1px; }
    .linen-photo-card.text-compact .l-recipient,
    .linen-photo-card.text-compact .l-closing,
    .linen-css-card.text-compact .l-recipient,
    .linen-css-card.text-compact .l-closing { font-size: clamp(12px, 1.3vw, 14px); }

    .editor-box {
      width: min(360px, 92vw); padding: 18px; border-radius: 18px;
      background: rgba(250,247,240,0.98); box-shadow: 0 20px 45px rgba(0,0,0,0.38);

    .editor-box.show { display: flex; }
    .editor-fields {

    .ed-tip { font-size: 11px; color: var(--ink-secondary); line-height: 1.35; }
    .ed-label { font-size: 12px; font-weight: 500; color: var(--ink-secondary); display: flex; flex-direction: column; gap: 4px; }
    .ed-input, .ed-area {
      width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid rgba(120,104,84,0.28);
      font-size: 16px; line-height: 1.4; background: #fff; color: var(--ink-primary); outline: none;
    }
    @media (min-width: 761px) {
      .editor-box { max-height: min(80vh, 540px); overflow: hidden; }
      .editor-fields { flex: 1; min-height: 0; overflow-y: auto; padding-right: 3px; }
      .ed-input, .ed-area { font-size: 13.5px; }
    }
    .ed-btns {
      flex-shrink: 0; display: flex; justify-content: space-between; gap: 8px;
      padding-top: 10px; border-top: 1px solid rgba(120,104,84,0.14);
    }
    .btn-save { padding: 9px 18px; border-radius: 9px; border: none; background: var(--ink-primary); color: #faf6ec; font-size: 13px; cursor: pointer; }
    .btn-reset { padding: 8px 13px; border-radius: 9px; border: 1px solid rgba(120,104,84,0.28); background: transparent; font-size: 12.5px; color: var(--ink-secondary); cursor: pointer; }

    @media (max-width: 760px) {
      .letter-cols { width: 100%; }
      .letter-cols.mobile-editing .linen-photo-card,
      .letter-cols.mobile-editing .linen-css-card { display: none !important; }
      .editor-box { width: 100%; max-width: 400px; margin-bottom: 18px; }

  <script>
    /**
     * 手绘 3D 立体弹出式贺卡单文件运行引擎（支持生日 / 圣诞双主题，横版左右折 / 4:3 横向长方形上下折）
     * 通俗说明：
     * 1. 采用 4 层零穿模安全走廊：封面翻越 90° 后立体纸片再平滑弹起，厚度全部朝纸面上方正向叠加，
     *    左侧道具与右前信封紧贴各自所属纸页平面，且按每张图的真实宽高自动拉开防撞间距。
     * 2. 生日主题：演奏《生日快乐歌》，翻开卡片在支持麦克风的环境下自动申请高灵敏度低频吹气（带实时气流感应条），
     *    不支持或拒绝权限时静默零报错，无缝使用“轻点直灭 + 长按 1 秒仿真吹气”。
     * 3. 圣诞主题：演奏《We Wish You a Merry Christmas》，左侧立体圣诞树常亮并柔和闪烁星星灯，
     *    点击圣诞树或底部“星灯”可切换璀璨闪耀与飘雪许愿，刺绣信与迷你信笺全部切换为圣诞快乐主题。
     */
    (function () {
      const cfg = window.CARD_CONFIG || {};
      const isChristmas = cfg.occasion === 'christmas';
      const topFold = cfg.fold === 'vertical';
      document.documentElement.classList.toggle('top-fold', topFold);
      document.documentElement.classList.toggle('is-christmas', isChristmas);

      /**
       * 为当前贺卡计算独立隔离的本地存储 Key，杜绝同域名下不同贺卡串改祝福语
       *
       * @returns {string} 本地存储 Key
       */
      function computeStorageKey() {
        if (typeof cfg.cardId === 'string' && cfg.cardId.trim()) {
          return `popup_card_blessing_v5_${cfg.cardId.trim()}`;
        }
        const seed = `${isChristmas ? 'xmas' : 'bday'}|${topFold ? 'v43' : 'h'}|${location.pathname}|${JSON.stringify(cfg.blessing || {})}`;
        let h = 2166136261;
        for (let i = 0; i < seed.length; i++) {
          h ^= seed.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return `popup_card_blessing_v5_${(h >>> 0).toString(16)}`;
      }
      const STORAGE_KEY = computeStorageKey();

      // 按主题与版式初始化标题与界面文案（圣诞模式 0 生日残留）
      if (isChristmas) {
        document.title = topFold ? '圣诞快乐 · 4:3 立体纸艺贺卡' : '圣诞快乐 · 手绘立体纸艺贺卡';
        document.getElementById('miniNoteCakeSvg').style.display = 'none';
        document.getElementById('miniNoteTreeSvg').style.display = 'block';
        document.getElementById('miniNoteTxt').textContent = 'MERRY CHRISTMAS';
        document.getElementById('xmasEmbroideryHeader').classList.add('show');
        document.getElementById('cssHeaderCakeSvg').style.display = 'none';
        document.getElementById('cssHeaderTreeSvg').style.display = 'block';
        document.getElementById('cssHeaderTxt').innerHTML = 'MERRY ~<br/>CHRISTMAS !';
        document.getElementById('wickAnchor').style.display = 'none';
        document.getElementById('treeLightsLayer').style.display = 'block';
        document.getElementById('iconWindSvg').style.display = 'none';
        document.getElementById('iconStarSvg').style.display = 'block';
        document.getElementById('lblPropAction').textContent = '星灯';
        document.getElementById('btnPropAction').title = '轻点让圣诞树星灯璀璨绽放或柔和开关';
        document.getElementById('propLayer').setAttribute('aria-label', '点击圣诞树点亮璀璨星灯');
        document.getElementById('propLayer').title = '轻点圣诞树触发星灯璀璨闪烁与飘雪';
      } else {
        document.title = topFold ? '生日快乐 · 4:3 立体纸艺贺卡' : '生日快乐 · 手绘立体纸艺贺卡';
        document.getElementById('btnPropAction').title = '轻点直接吹灭或重燃，长按约 1 秒仿真吹气';
        document.getElementById('propLayer').setAttribute('aria-label', '轻触直接熄灭或点亮蜡烛，长按仿真吹气');
        document.getElementById('propLayer').title = '轻点直灭或重燃，长按仿真吹气';
      }
      if (topFold) {
        document.querySelector('#coverTip span').textContent = isChristmas ? '轻触向上掀开圣诞贺卡' : '轻触向上掀开立体贺卡';
      } else if (isChristmas) {
        document.querySelector('#coverTip span').textContent = '轻触翻开圣诞立体贺卡';
      }

      /**
       * 判断图片配置值是否为有效的 URL 或 Base64 DataURI
       *
       * @param {string} val - 图片地址配置
       * @returns {boolean} 是否有效
       */
      function isRealUrl(val) {
        return typeof val === 'string' && val.trim().length > 0 && !val.includes('{{');
      }

      /**
       * 将 SVG 字符串编码为 DataURI（仅在缺失图片时作为主题匹配兜底）
       *
       * @param {string} svgStr - SVG 文本
       * @returns {string} DataURI 字符串
       */
      function svgToDataUri(svgStr) {
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
      }

      /**
       * 生成与主题及横竖比例一致的矢量封面兜底图
       *
       * @param {string} accent - 主色
       * @param {string} flower - 点缀色
       * @returns {string} SVG DataURI
       */
      function buildFallbackCoverSvg(accent, flower) {
        const w = topFold ? 560 : 430, h = topFold ? 420 : 540, cx = w / 2;
        const line1 = isChristmas ? 'Merry' : 'Happy';
        const line2 = isChristmas ? 'Christmas' : 'Birthday';
        return svgToDataUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="#faf5e6"/><circle cx="70" cy="65" r="46" fill="${accent}" opacity="0.18"/><circle cx="${w - 70}" cy="70" r="48" fill="${flower}" opacity="0.16"/><text x="${cx}" y="${h * 0.32}" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="46" fill="${accent}">${line1}</text><text x="${cx}" y="${h * 0.45}" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="46" fill="${accent}">${line2}</text></svg>`);
      }

      /**
       * 生成内页底图矢量兜底图
       *
       * @param {'left'|'right'} side - 页侧标识
       * @param {string} accent - 主色
       * @param {string} flower - 点缀色
       * @returns {string} SVG DataURI
       */
      function buildFallbackInsideSvg(side, accent, flower) {
        const w = topFold ? 560 : 430, h = topFold ? 420 : 540;
        const edgeX = side === 'left' ? 40 : w - 40;
        return svgToDataUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="#faf6ea"/><ellipse cx="${edgeX}" cy="${h * 0.5}" rx="68" ry="${h * 0.4}" fill="${accent}" opacity="0.16"/><circle cx="${edgeX}" cy="${h * 0.25}" r="14" fill="${flower}" opacity="0.5"/></svg>`);
      }

      /**
       * 生成主题一致的花环拱门兜底图
       *
       * @param {string} accent - 主色
       * @param {string} flower - 点缀色
       * @returns {string} SVG DataURI
       */
      function buildFallbackArchSvg(accent, flower) {
        const t1 = isChristmas ? 'MERRY' : 'HAPPY';
        const t2 = isChristmas ? 'CHRISTMAS' : 'BIRTHDAY';
        return svgToDataUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280"><path d="M52,272 C62,72 398,72 408,272" fill="none" stroke="#faf6ec" stroke-width="56" stroke-linecap="round"/><path d="M52,272 C62,72 398,72 408,272" fill="none" stroke="${accent}" stroke-width="32" stroke-linecap="round" opacity="0.72"/><text x="230" y="88" text-anchor="middle" font-family="Georgia,serif" font-weight="bold" font-size="27" fill="#c94c44">${t1}</text><text x="230" y="122" text-anchor="middle" font-family="Georgia,serif" font-weight="bold" font-size="25" fill="#4f7348">${t2}</text><circle cx="116" cy="146" r="11" fill="${flower}"/><circle cx="344" cy="146" r="11" fill="${flower}"/></svg>`);
      }

      /**
       * 生成左侧立体道具兜底图（生日蛋糕 或 圣诞树）
       *
       * @param {string} accent - 主色
       * @returns {string} SVG DataURI
       */
      function buildFallbackPropSvg(accent) {
        if (isChristmas) {
          return svgToDataUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 220"><polygon points="90,26 42,102 138,102" fill="${accent}" stroke="#3e3326" stroke-width="2"/><polygon points="90,64 30,148 150,148" fill="${accent}" stroke="#3e3326" stroke-width="2"/><polygon points="90,104 20,182 160,182" fill="${accent}" stroke="#3e3326" stroke-width="2"/><rect x="66" y="182" width="48" height="28" rx="3" fill="#a67346" stroke="#4c3522" stroke-width="2"/></svg>`);
        }
        return svgToDataUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 200"><rect x="76" y="16" width="8" height="32" rx="2" fill="#fff7ea" stroke="#5a3828" stroke-width="1.5"/><rect x="52" y="48" width="56" height="32" rx="6" fill="#e26e5c" stroke="#5a3828" stroke-width="1.8"/><rect x="38" y="76" width="84" height="36" rx="7" fill="#d95848" stroke="#5a3828" stroke-width="1.8"/><rect x="28" y="126" width="90" height="10" rx="2" fill="#c4955e" stroke="#5a3828" stroke-width="1.5"/></svg>`);
      }

      /**
       * 生成人物立牌兜底图
       *
       * @param {string} accent - 主色
       * @param {string} flower - 点缀色
       * @returns {string} SVG DataURI
       */
      function buildFallbackGirlSvg(accent, flower) {
        return svgToDataUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 280"><path d="M55,245 C45,160 65,120 110,120 C155,120 175,160 165,245 Z" fill="#c8b088" stroke="#5a432d" stroke-width="2.2"/><ellipse cx="110" cy="95" rx="34" ry="42" fill="#f7dfd0" stroke="#5a432d" stroke-width="1.8"/><ellipse cx="110" cy="245" rx="82" ry="22" fill="${accent}" opacity="0.72"/><circle cx="72" cy="246" r="8" fill="${flower}"/><circle cx="148" cy="246" r="8" fill="${flower}"/></svg>`);
      }

      /* 1. 写入全局配色与图片资源 */
      const theme = cfg.styleTheme || {};
      const rootStyle = document.documentElement.style;
      if (theme.tableInner) rootStyle.setProperty('--bg-inner', theme.tableInner);
      if (theme.tableOuter) rootStyle.setProperty('--bg-outer', theme.tableOuter);
      if (theme.paperCream) rootStyle.setProperty('--paper-cream', theme.paperCream);
      if (theme.primaryAccent) rootStyle.setProperty('--accent-primary', theme.primaryAccent);
      if (theme.secondaryAccent) rootStyle.setProperty('--accent-secondary', theme.secondaryAccent);
      if (theme.waxSealColor) rootStyle.setProperty('--wax-seal', theme.waxSealColor);
      if (theme.filterCss) rootStyle.setProperty('--inside-filter', theme.filterCss);

      const accent = theme.primaryAccent || '#4f7348';
      const flower = theme.secondaryAccent || '#b5496b';

      document.getElementById('coverImg').src = isRealUrl(cfg.coverImageUrl) ? cfg.coverImageUrl : buildFallbackCoverSvg(accent, flower);
      document.getElementById('insideLeftImg').src = isRealUrl(cfg.insideLeftUrl) ? cfg.insideLeftUrl : buildFallbackInsideSvg('left', accent, flower);
      document.getElementById('insideRightImg').src = isRealUrl(cfg.insideRightUrl) ? cfg.insideRightUrl : buildFallbackInsideSvg('right', accent, flower);

      const archSrc = isRealUrl(cfg.archUrl) ? cfg.archUrl : buildFallbackArchSvg(accent, flower);
      const charSrc = isRealUrl(cfg.characterImageUrl) ? cfg.characterImageUrl : buildFallbackGirlSvg(accent, flower);
      const propSrc = isRealUrl(cfg.cakeTableUrl) ? cfg.cakeTableUrl : buildFallbackPropSvg(accent);

      const archImgEl = document.getElementById('archImg');
      const charImgEl = document.getElementById('charImg');
      const propImgEl = document.getElementById('propImg');
      const propSlotEl = document.getElementById('propSlot');
      const envSlotEl = document.getElementById('envSlot');
      const popupStageEl = document.getElementById('popupStage');

      /**
       * 全局动态防穿模安全布局度量（在每张图加载完成后自动重算，适应所有 Agent 生成的宽/高/胖/瘦图）
       */
      const layout = {
        archW: topFold ? 536 : 510,
        archH: topFold ? 224 : 300,
        charW: topFold ? 228 : 240,
        charH: topFold ? 268 : 292,
        propW: topFold ? 152 : 168,
        propH: topFold ? 186 : 198,
        propX: topFold ? -184 : -224,
        propY: topFold ? 344 : 206,
        envX: topFold ? 186 : 228,
        envY: topFold ? 338 : 202
      };

      /**
       * 依据任意图片的真实像素宽高比，将其严格约束在互不相交的 3D 安全走廊盒内，
       * 并动态推开左侧道具与右侧火漆信封，确保全 Agent 通用零穿模。
       */
      function computeSafeLayout() {
        const archLayer = document.getElementById('archLayer');
        const charLayer = document.getElementById('charLayer');

        // 1. 花拱尺寸适配（严格按原图纵横比等比适配，绝不强行拉伸窄花拱）
        if (archImgEl.naturalWidth) {
          const maxW = topFold ? 536 : 536;
          const maxH = topFold ? 224 : 316;
          const s = Math.min(maxW / archImgEl.naturalWidth, maxH / archImgEl.naturalHeight);
          layout.archW = Math.round(archImgEl.naturalWidth * s);
          layout.archH = Math.round(archImgEl.naturalHeight * s);
          Object.assign(archLayer.style, {
            width: layout.archW + 'px',
            height: layout.archH + 'px',
            marginLeft: (-layout.archW / 2) + 'px',
            marginTop: (-layout.archH) + 'px'
          });
        }

        // 2. 中央人物立牌适配（自动包容宽姿势，同时不超过安全盒上限）
        if (charImgEl.naturalWidth) {
          const maxW = topFold ? 236 : 262;
          const maxH = topFold ? 270 : 308;
          const s = Math.min(maxW / charImgEl.naturalWidth, maxH / charImgEl.naturalHeight);
          layout.charW = Math.round(charImgEl.naturalWidth * s);
          layout.charH = Math.round(charImgEl.naturalHeight * s);
          Object.assign(charLayer.style, {
            width: layout.charW + 'px',
            height: layout.charH + 'px',
            marginLeft: (-layout.charW / 2) + 'px',
            marginTop: (-layout.charH) + 'px'
          });
        }

        // 3. 左侧道具（蛋糕桌或圣诞树）适配
        if (propImgEl.naturalWidth) {
          const maxW = topFold ? 156 : 178;
          const maxH = topFold ? 188 : 210;
          const s = Math.min(maxW / propImgEl.naturalWidth, maxH / propImgEl.naturalHeight);
          layout.propW = Math.round(propImgEl.naturalWidth * s);
          layout.propH = Math.round(propImgEl.naturalHeight * s);
          propSlotEl.style.setProperty('--prop-width', layout.propW + 'px');
          propSlotEl.style.setProperty('--prop-height', layout.propH + 'px');
        }

        if (topFold) {
          // 4:3 横向长方形下页宽 560px（X ∈ [-280, +280]）
          const propHalf = layout.propW / 2;
          layout.propX = -Math.round(Math.max(178, Math.min(280 - propHalf - 16, layout.charW / 2 + propHalf * 0.48 + 12)));
          layout.propY = 346;
          layout.envX = Math.round(Math.max(182, Math.min(280 - 66 - 16, layout.charW / 2 + 46)));

          layout.propX = -Math.round(Math.max(210, Math.min(430 - propHalf - 30, layout.charW / 2 + propHalf + 18)));
          layout.propY = 208;
          layout.envX = Math.round(Math.max(216, Math.min(430 - 66 - 30, layout.charW / 2 + 66 + 22)));
          layout.envY = 204;
        }

      function renderChristmasTreeLights() {

      /* 2. 初始化空中温暖星尘微光 */
      const sparklesEl = document.getElementById('sparklesLayer');
      [[15,18],[28,12],[46,15],[67,14],[82,20],[12,36],[88,34]].forEach(([x,y], i) => {
